name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ensure-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure GitHub Pages is enabled for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is already enabled."
          else
            echo "GitHub Pages is not enabled; creating a Pages site using GitHub Actions."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=workflow
          fi

          # Verify Pages is available before the deployment job starts.
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
              echo "GitHub Pages is ready."
              exit 0
            fi
            sleep 2
          done

          echo "GitHub Pages could not be enabled automatically."
          exit 1

  deploy:
    needs: ensure-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
